[package]
name = "magister-core"
version = "0.1.0"
edition = "2021"
description = "Shared Magister protocol logic for Friday: desktop app (src-tauri) and web-api. No Tauri, no app state — pure functions + HTTP."

[dependencies]
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
rustls = "0.23"
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.23"
sha2 = "0.11"
rand = "0.10"
url = "2"
thiserror = "2"
log = "0.4"
