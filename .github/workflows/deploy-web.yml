# Deploy the Friday web app to GitHub Pages (gh-pages BRANCH).
#
# Served at the custom domain https://fridayapp.nl (apex, DNS: A records →
# GitHub Pages IPs). github.io URLs redirect there once the domain is set.
#
# Coexists with the F-Droid repo on the SAME branch:
# - the app lives at site root, fdroid at /fdroid/ (untouched)
# - rsync --delete prunes stale APP files only; /fdroid and CNAME are excluded
# - release.yml's peaceiris step has keep_files:true so Android releases
#   never wipe the app (and this workflow never touches fdroid/)
# - pushes retry with rebase in case an Android release lands mid-deploy
#
# One-time setup (user, dashboard only): nothing required. The workflow
# defaults VITE_API_URL to the live Render backend; override anytime via
# repo Settings → Variables → Actions → VITE_API_URL.
# Repo Settings → Pages → Source stays "Deploy from a branch" (gh-pages) —
# do NOT switch to GitHub Actions.

name: Deploy web app to Pages branch

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "static/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "svelte.config.js"
      - "vite.config.js"
      - "tsconfig.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://friday-api-kdz4.onrender.com/api' }}
    steps:
      - name: Checkout source (main)
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 1

      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Build static site
        working-directory: source
        # Custom domain fridayapp.nl — site lives at root, exactly like
        # Tauri/Caddy/dev builds. BASE_PATH stays unset.
        run: pnpm build

      - name: Overlay build onto Pages branch (fdroid/ excluded)
        run: |
          set -euo pipefail
          # Jekyll would ignore _app/ — disable it (one empty file, harmless to fdroid).
          touch pages/.nojekyll
          # Merge build output into branch root; prune stale app files;
          # never touch fdroid/ or the Pages CNAME (custom domain fridayapp.nl).
          rsync -a --delete \
            --exclude='/fdroid' \
            --exclude='/.git' \
            --exclude='/.nojekyll' \
            --exclude='/CNAME' \
            source/build/ pages/
          # Custom domain — GitHub Pages needs this exact file to serve the
          # apex domain and issue its TLS cert. Idempotent (same content).
          printf 'fridayapp.nl\n' > pages/CNAME
          cd pages
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            echo "changed=false" >> "$GITHUB_ENV"
          else
            echo "changed=true" >> "$GITHUB_ENV"
          fi

      - name: Commit and push (rebase-retry vs concurrent release)
        if: env.changed == 'true'
        working-directory: pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages origin/gh-pages
          git commit -m "Deploy web app ${{ github.sha }}"
          for i in 1 2 3; do
            git pull --rebase origin gh-pages && git push origin HEAD:gh-pages && break
            echo "Push conflict, retry $i/3…"
            sleep 10
          done
