[package]
name = "friday"
version = "2.3.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "friday_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1.1"
# Android: Keystore-backed SharedPreferences store. `cli` enables the store
# selection API; `android-native-keyring-store` is the actual Keystore backend.
# (`cli` alone does not pull in the android store — the optional dep must be
# named explicitly. Default `v1` stays enabled; its store crates are all gated
# to non-Android targets so they compile away.)
keyring = { version = "4.1", features = ["cli", "android-native-keyring-store"] }

[dependencies]
tauri = { version = "2", features = [] }
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS-level secure storage for secrets (Magister tokens, AI API key).
keyring-core = "1.0"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
chrono = { version = "0.4", features = ["serde"] }
# Trimmed from "full" — audited actual tokio:: usage in src/ (sync::Mutex, jni.rs's
# Runtime::new() for the JNI entry point, #[tokio::test], and tokio::time::sleep for
# the Part B 5A rate-limit retry backoff in client.rs). Note: Tauri and reqwest likely
# pull in some tokio features transitively regardless (Cargo unions feature flags
# across the whole dependency graph), so the real binary-size delta from this specific
# line may be smaller than "full → minimal" suggests — still correct to be explicit
# rather than blanket-enable everything, just don't expect a huge win alone.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
thiserror = "2"
url = "2"
futures = "0.3"
mime_guess = "2.0.5"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-mcp-bridge = "0.12"
jni = "0.21.1"
dirs = "6"
async-trait = "0.1"
# Attachment text extraction for the AI `read_attachment_text` tool.
# pdf-extract is pure-Rust (MIT), pulls in lopdf/cff-parser/postscript.
# zip is only used to unwrap .docx containers (pure-Rust deflate via zlib-rs).
pdf-extract = "0.12"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

# Desktop (Linux/Windows/macOS): OS keychain via keyring's `v1` feature.
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "4.1", features = ["v1"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
incremental = false
strip = true # Strips symbols from the binary

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
wiremock = "0.6.5"
