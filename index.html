    <!-- Apply the saved background mode before first paint (no dark flash in light mode). -->

      (function () {
        try {

            (m === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
          var c = document.documentElement.classList;
          if (light) {
            c.remove("dark");
            c.add("mode-light");
            document.documentElement.style.colorScheme = "light";
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f6f4fb");
          } else if (m === "amoled") {
            c.add("mode-amoled");
          }
        } catch (e) {}
      })();
