# Render Blueprint — Friday web-api (stateless, free tier).
# Apply once in the Render dashboard (Blueprints → New → this repo).
# The frontend (GitHub Pages) needs the resulting public URL as VITE_API_URL
# at build time:  https://<service>.onrender.com/api
services:
  - type: web
    name: friday-api
    runtime: docker
    plan: free
    dockerfilePath: ./crates/web-api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      # GitHub Pages origin. Tighten only after the Pages site exists;
      # unset/permissive is safe (per-request Bearer auth, never cookies).
      - key: ALLOWED_ORIGINS
        value: https://jpdeerenberg.github.io
